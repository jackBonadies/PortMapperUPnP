name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Attach APK to a GitHub release (tag name, blank to build only)'
        required: false
        default: ''

jobs:
  build:
    name: Build Release APK + Play Store AAB
    runs-on: ubuntu-latest
    environment: release-signing

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # app/build.gradle is the source of truth for versionCode/versionName.
      - name: Resolve version
        run: |
          GRADLE_VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle)
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Could not parse versionName from app/build.gradle"
            exit 1
          fi
          echo "app/build.gradle declares versionName $GRADLE_VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.attach_to_release }}" ]; then
            echo "Build-only run (no tag supplied) — using the Gradle version"
            echo "VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          else
            RAW="${{ github.event_name == 'workflow_dispatch' && inputs.attach_to_release || github.ref_name }}"
            TAG_VERSION="${RAW#v}"
            if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
              echo "::error::Tag '$RAW' implies version $TAG_VERSION but app/build.gradle declares versionName '$GRADLE_VERSION'. Bump versionName (and versionCode) or retag."
              exit 1
            fi
            echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          if [ ! -s "$RUNNER_TEMP/keystore/release.keystore" ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      # no Firebase/Google Services dependency
      - name: Build no-GPS release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleProdRelease_no_gps --no-daemon

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set — the Play Store build requires Firebase config"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          if [ ! -s app/google-services.json ]; then
            echo "::error::app/google-services.json is missing or empty after decode"
            exit 1
          fi
          if ! grep -q '"project_info"' app/google-services.json; then
            echo "::error::app/google-services.json does not look like a valid Firebase config (missing project_info)"
            exit 1
          fi

      - name: Build Play Store AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:bundleProdRelease --no-daemon

      - name: Stage artifacts
        run: |
          APK=$(find app/build/outputs/apk/prod/release_no_gps -name "*.apk" -type f 2>/dev/null | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under app/build/outputs/apk/prod/release_no_gps"
            find app/build/outputs/apk -name "*.apk" -type f || true
            exit 1
          fi
          mkdir -p release-apks
          cp "$APK" "release-apks/portpilot-${VERSION}.apk"

          AAB=$(find app/build/outputs/bundle/prodRelease -name "*.aab" -type f 2>/dev/null | head -n1)
          if [ -z "$AAB" ]; then
            echo "::error::No AAB found under app/build/outputs/bundle/prodRelease"
            find app/build/outputs/bundle -name "*.aab" -type f || true
            exit 1
          fi
          mkdir -p release-aab
          cp "$AAB" "release-aab/portpilot-${VERSION}.aab"

          ls -lh release-apks/ release-aab/

      - name: Verify artifacts are not debug-signed
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found — skipping signature check"
            exit 0
          fi
          DN=$("$APKSIGNER" verify --print-certs "release-apks/portpilot-${VERSION}.apk" | grep -m1 "certificate DN:")
          echo "$DN"
          if echo "$DN" | grep -q "CN=Android Debug"; then
            echo "::error::APK is debug-signed — the release signing config did not take effect. Check the ANDROID_KEYSTORE_* secrets."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: portpilot-apk
          path: release-apks/portpilot-*.apk
          if-no-files-found: error

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: portpilot-playstore-aab
          path: release-aab/portpilot-*.aab
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.attach_to_release != '')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_to_release || github.ref_name }}
          files: release-apks/portpilot-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: "true"
